<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Kiddo Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card card">
      <a href="index.html" class="back-arrow">&lsaquo;</a>
      <div class="brand">Kiddo Finance</div>
      <div class="auth-subtitle">Iniciar Sesión</div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Usuario o Email</label>
          <input type="text" id="username" placeholder="usuario o correo@ejemplo.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required>
        </div>
        <p id="loginError" style="color:var(--danger);font-size:0.875rem;display:none;margin-bottom:12px;"></p>
        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Iniciar Sesión</button>
      </form>

      <div class="auth-footer">
        ¿No tienes cuenta? <a href="register.html">Regístrate</a>
      </div>
    </div>
  </div>

  <script>
    (async () => {
      let API;
      try {
        const r = await fetch('api/url.php');
        API = (await r.json()).api_base;
      } catch { API = '/kiddo-finance/api'; }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('loginError');
        btn.disabled = true;
        btn.textContent = 'Ingresando...';

        try {
          const res = await fetch(API + '/login.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: document.getElementById('username').value.trim(),
              password: document.getElementById('password').value,
            }),
          });
          const json = await res.json();
          if (!json.ok) { throw new Error(json.error); }
          window.location.href = 'dashboard.html';
        } catch (error) {
          err.textContent = error.message;
          err.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Iniciar Sesión';
        }
      });
    })();
  </script>
</body>
</html>
