<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-full"><h2>Kiddo Finance</h2><span class="wireframe-label">Wireframe</span></div>
        <div class="logo-icon">KF</div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span class="nav-text">Dashboard</span></a>
        <a href="perfil.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-text">Perfil</span></a>
        <a href="movimientos.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></span><span class="nav-text">Movimientos</span></a>
        <a href="metas.html" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span><span class="nav-text">Metas</span></a>
        <a href="historial.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span><span class="nav-text">Historial</span></a>
        <a href="logros.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg></span><span class="nav-text">Logros</span></a>
      </nav>
      <div class="sidebar-bottom">
        <a href="login.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="nav-text">Cerrar Sesión</span></a>
        <button class="sidebar-toggle" id="sidebarToggle"><span class="nav-icon"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></span><span class="toggle-text">Contraer</span></button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Metas de Ahorro</h1>
          <p class="subtitle">Crear y monitorear metas</p>
        </div>
        <button class="btn btn-primary">+ Nueva Meta</button>
      </div>

      <div class="card saldo-card">
        <div class="saldo-label">Saldo disponible para metas</div>
        <div class="saldo-amount">$0.00</div>
      </div>

      <div class="card">
        <div class="empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          </div>
          <p>No tienes metas de ahorro aún</p>
          <button class="btn btn-primary">Crear tu primera meta</button>
        </div>
      </div>
    </main>
<!-- MODAL META -->
<div class="modal-overlay" id="goalModal">
  <div class="goal-modal">

    <div class="modal-header">
      <h2>Nueva Meta</h2>
      <button class="close-modal" id="closeModal">&times;</button>
    </div>

    <form id="goalForm">

      <div class="form-group">
        <label>Nombre de la meta</label>
        <input type="text" id="goalName" placeholder="Ej: Comprar audífonos" required>
      </div>

      <div class="form-group">
        <label>Monto objetivo</label>
        <input type="number" id="goalTarget" placeholder="500000" required>
      </div>

      <div class="form-group">
        <label>Dinero ahorrado</label>
        <input type="number" id="goalSaved" placeholder="100000" required>
      </div>

      <div class="form-group">
        <label>Fecha límite</label>
        <input type="date" id="goalDate">
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        Guardar Meta
      </button>

    </form>

  </div>
</div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
