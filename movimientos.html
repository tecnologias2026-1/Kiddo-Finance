<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Movimiento - Kiddo Finance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo-full"><h2>Kiddo Finance</h2><span class="wireframe-label">Wireframe</span></div>
        <div class="logo-icon">KF</div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span class="nav-text">Dashboard</span></a>
        <a href="perfil.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-text">Perfil</span></a>
        <a href="movimientos.html" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></span><span class="nav-text">Movimientos</span></a>
        <a href="metas.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span><span class="nav-text">Metas</span></a>
        <a href="historial.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span><span class="nav-text">Historial</span></a>
        <a href="logros.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg></span><span class="nav-text">Logros</span></a>
      </nav>
      <div class="sidebar-bottom">
        <a href="login.html"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span><span class="nav-text">Cerrar Sesión</span></a>
        <button class="sidebar-toggle" id="sidebarToggle"><span class="nav-icon"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></span><span class="toggle-text">Contraer</span></button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Registrar Movimiento</h1>
          <p class="subtitle">RF04 y RF05: Registrar ingresos y gastos</p>
        </div>
      </div>

      <div class="card" style="max-width: 600px;">
        <form>
          <div class="toggle-group" style="margin-bottom: 24px;">
            <button type="button" class="toggle-btn active">Ingreso</button>
            <button type="button" class="toggle-btn">Gasto</button>
          </div>
          <div class="form-group">
            <label for="monto">Monto</label>
            <input type="number" id="monto" placeholder="$" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label for="descripcion">Descripción</label>
            <input type="text" id="descripcion" placeholder="Ej: Mesada semanal">
          </div>
          <div class="form-group">
            <label for="categoria">Categoría</label>
            <select id="categoria">
              <option value="">Seleccionar categoría</option>
              <option value="mesada">Mesada</option>
              <option value="regalo">Regalo</option>
              <option value="ahorro">Ahorro</option>
              <option value="comida">Comida</option>
              <option value="juguetes">Juguetes</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <button type="button" class="btn btn-primary btn-full btn-submit-movement">Registrar Ingreso</button>
        </form>
      </div>
    </main>

  </div>
  <script src="js/app.js"></script>
</body>
</html>
